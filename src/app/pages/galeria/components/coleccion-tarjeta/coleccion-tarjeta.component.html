<article class="tarjeta" [class.tarjeta--borrador]="coleccion().estado === 'borrador'">

    @if (reordenable()) {
    <span class="tarjeta__arrastre" title="Arrastra para reordenar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="9" cy="6" r="1.4" />
            <circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" />
            <circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" />
            <circle cx="15" cy="18" r="1.4" />
        </svg>
    </span>
    }

    <button type="button" class="tarjeta__cuerpo" (click)="onAbrir()" [attr.aria-label]="'Abrir ' + coleccion().titulo">

        <span class="tarjeta__imagen">
            @if (portada(); as src) {
            <img [src]="src" [alt]="coleccion().titulo" loading="lazy" />
            } @else {
            <span class="tarjeta__sin-imagen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4.5" width="18" height="15" rx="2.5" />
                    <circle cx="8.5" cy="9.5" r="1.5" />
                    <path d="M3.5 17l5-5 4 4 3.5-3.5 4.5 4.5" />
                </svg>
                <span>Sin fotografías</span>
            </span>
            }

            <span class="tarjeta__estado" [class.tarjeta__estado--publicado]="coleccion().estado === 'publicado'">
                {{ coleccion().estado === 'publicado' ? 'Publicado' : 'Borrador' }}
            </span>
        </span>

        <span class="tarjeta__datos">
            <span class="tarjeta__titulo">{{ coleccion().titulo }}</span>

            @if (coleccion().categoria; as categoria) {
            <span class="tarjeta__categoria">{{ categoria.nombre }}</span>
            } @else {
            @if (periodo(); as texto) {
            <span class="tarjeta__categoria">{{ texto }}</span>
            }
            }

            <span class="tarjeta__fotos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <circle cx="8.5" cy="10" r="1.4" />
                    <path d="m4 17 4.5-4.5 3 3L15 12l5 5" />
                </svg>
                {{ coleccion().totalFotos }}
                {{ coleccion().totalFotos === 1 ? 'fotografía' : 'fotografías' }}
            </span>
        </span>
    </button>

    <button type="button" class="tarjeta__editar" (click)="onEditar($event)"
        [attr.aria-label]="'Editar ' + coleccion().titulo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
        </svg>
    </button>

</article>
