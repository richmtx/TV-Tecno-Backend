<div class="subida">

    <label class="zona" [class.zona--activa]="arrastrando()" [class.zona--ocupada]="subiendo()"
        (dragover)="alArrastrarSobre($event)" (dragleave)="alSalirDelArea($event)" (drop)="alSoltar($event)">

        <input type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif,image/tiff"
            [disabled]="subiendo()" (change)="alElegirArchivos($event)" hidden />

        @if (subiendo()) {
        <span class="zona__icono zona__icono--girando" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.2-8.6" />
            </svg>
        </span>
        <span class="zona__titulo">
            Subiendo {{ progreso().hechas }} de {{ progreso().total }}…
        </span>
        <span class="zona__ayuda">No cierres esta ventana.</span>

        <span class="barra" role="progressbar" [attr.aria-valuenow]="progreso().hechas"
            [attr.aria-valuemax]="progreso().total">
            <span class="barra__relleno" [style.width.%]="(progreso().hechas / progreso().total) * 100"></span>
        </span>
        } @else {
        <span class="zona__icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6.5 18a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.62-1.7A3.9 3.9 0 0 1 20.5 18" />
                <polyline points="9.5 12.5 12 10 14.5 12.5" />
                <line x1="12" y1="10" x2="12" y2="18" />
            </svg>
        </span>
        <span class="zona__titulo">Arrastra las fotografías aquí</span>
        <span class="zona__ayuda">
            o haz clic para elegirlas · JPG, PNG, WEBP · máx. {{ maximoMb }} MB cada una
        </span>
        }
    </label>

    @if (rechazados().length > 0) {
    <div class="rechazados">
        <div class="rechazados__cabecera">
            <span class="rechazados__titulo">
                {{ rechazados().length }}
                {{ rechazados().length === 1 ? 'archivo no se subió' : 'archivos no se subieron' }}
            </span>
            <button type="button" class="btn btn--texto" (click)="limpiarRechazados()">Ocultar</button>
        </div>
        <ul class="rechazados__lista">
            @for (r of rechazados(); track r.nombre) {
            <li>
                <span class="rechazados__nombre">{{ r.nombre }}</span>
                <span class="rechazados__motivo">{{ r.motivo }}</span>
            </li>
            }
        </ul>
    </div>
    }

</div>
