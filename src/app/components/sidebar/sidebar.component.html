<aside class="sidebar">

    <!-- Definición de iconos SVG -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="icon-dashboard" viewBox="0 0 24 24">
                <path d="M3 12L12 3l9 9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-home" viewBox="0 0 24 24">
                <path d="M3 11.5L12 4l9 7.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M5.5 10v9.5h13V10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-calendar" viewBox="0 0 24 24">
                <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"
                    fill="none" />
                <path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" />
                <circle cx="8.5" cy="14" r="1" fill="currentColor" />
                <circle cx="12" cy="14" r="1" fill="currentColor" />
            </symbol>
            <symbol id="icon-video" viewBox="0 0 24 24">
                <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"
                    fill="none" />
                <path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="currentColor" />
            </symbol>
            <symbol id="icon-image" viewBox="0 0 24 24">
                <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"
                    fill="none" />
                <circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" />
                <path d="M3.5 17l5-5 4 4 3.5-3.5 4.5 4.5" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-mail" viewBox="0 0 24 24">
                <rect x="3" y="5.5" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"
                    fill="none" />
                <path d="M4 7.5l8 5.5 8-5.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-info" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" />
                <path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <circle cx="12" cy="8" r="1.1" fill="currentColor" />
            </symbol>
            <symbol id="icon-live" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="2" fill="currentColor" />
                <path d="M8.5 15.5a5 5 0 010-7M15.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.8"
                    fill="none" stroke-linecap="round" />
                <path d="M6 18a8.5 8.5 0 010-12M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8"
                    fill="none" stroke-linecap="round" />
            </symbol>
            <symbol id="icon-users" viewBox="0 0 24 24">
                <circle cx="9" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.8" fill="none" />
                <path d="M3.5 19.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" />
                <path d="M15.5 5.7a3.2 3.2 0 010 5.6M17.5 14.8c1.8.7 3 2.3 3 4.7" stroke="currentColor"
                    stroke-width="1.8" fill="none" stroke-linecap="round" />
            </symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none" />
                <path
                    d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </symbol>
            <symbol id="icon-share" viewBox="0 0 24 24">
                <circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none" />
                <circle cx="17.5" cy="6" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none" />
                <circle cx="17.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none" />
                <path d="M8.3 10.8l6.9-3.6M8.3 13.2l6.9 3.6" stroke="currentColor" stroke-width="1.8" />
            </symbol>
            <symbol id="icon-menu" viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h11M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </symbol>
            <symbol id="icon-chevron" viewBox="0 0 24 24">
                <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-logout" viewBox="0 0 24 24">
                <path d="M9 5H6.5A2.5 2.5 0 004 7.5v9A2.5 2.5 0 006.5 19H9" stroke="currentColor" stroke-width="1.8"
                    fill="none" stroke-linecap="round" />
                <path d="M14 8l4 4-4 4M18 12H9.5" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-collapse" viewBox="0 0 24 24">
                <path d="M14 7l-5 5 5 5M19 7l-5 5 5 5" stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </symbol>
            <symbol id="icon-open" viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </symbol>
        </defs>
    </svg>

    <!-- Encabezado: logo + botón para ocultar -->
    <div class="sidebar__header">
        <div class="sidebar__logo">
            <img ngSrc="assets/LogoTexto.png" width="180" height="72" alt="" priority class="sidebar__logo-img" />
        </div>
        <button class="sidebar__toggle" (click)="toggleSidebar()" type="button" aria-label="Ocultar menú"
            title="Ocultar menú">
            <svg class="sidebar__icon">
                <use [attr.href]="colapsado() ? '#icon-open' : '#icon-collapse'" />
            </svg>
        </button>
    </div>

    <!-- Navegación -->
    <nav class="sidebar__nav">

        <!-- Dashboard -->
        <a routerLink="/dashboard" routerLinkActive="sidebar__link--active" [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar__link sidebar__link--dashboard">
            <svg class="sidebar__icon">
                <use href="#icon-dashboard" />
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- Secciones del sitio -->
        <p class="sidebar__section-title">Secciones del Sitio</p>
        <ul class="sidebar__list">
            @for (item of seccionesSitio; track item.route) {
            <li>
                <a [routerLink]="item.route" routerLinkActive="sidebar__link--active" class="sidebar__link">
                    <svg class="sidebar__icon">
                        <use [attr.href]="'#icon-' + item.icon" />
                    </svg>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>

        <hr class="sidebar__divider" />

        <!-- Configuración -->
        <p class="sidebar__section-title">Configuración</p>
        <ul class="sidebar__list">
            @for (item of configuracion; track item.route) {
            <li>
                <a [routerLink]="item.route" routerLinkActive="sidebar__link--active" class="sidebar__link">
                    <svg class="sidebar__icon">
                        <use [attr.href]="'#icon-' + item.icon" />
                    </svg>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>

    </nav>

    <!-- Tarjeta de usuario -->
    <div class="sidebar__user-wrapper">

        @if (userMenuOpen()) {
        <div class="sidebar__user-menu">
            <button class="sidebar__user-menu-item" (click)="logout()">
                <svg class="sidebar__icon">
                    <use href="#icon-logout" />
                </svg>
                <span>Cerrar sesión</span>
            </button>
        </div>
        }

        <button class="sidebar__user" (click)="toggleUserMenu()" [class.sidebar__user--open]="userMenuOpen()">
            <span class="sidebar__user-avatar">{{ userInitials }}</span>
            <span class="sidebar__user-info">
                <span class="sidebar__user-name">{{ userName }}</span>
                <span class="sidebar__user-role">{{ userRole }}</span>
            </span>
            <svg class="sidebar__icon sidebar__user-chevron">
                <use href="#icon-chevron" />
            </svg>
        </button>

    </div>

</aside>
