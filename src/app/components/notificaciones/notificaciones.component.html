<div class="notificaciones" aria-live="polite" aria-atomic="false">
    @for (n of notificaciones(); track n.id) {
    <div class="notificacion" [class.notificacion--error]="n.tipo === 'error'" role="status">
        <span class="notificacion__icono" aria-hidden="true">
            @if (n.tipo === 'exito') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="13" />
                <line x1="12" y1="16.5" x2="12.01" y2="16.5" />
            </svg>
            }
        </span>
        <p class="notificacion__texto">{{ n.texto }}</p>
        <button type="button" class="notificacion__cerrar" aria-label="Cerrar aviso" (click)="cerrar(n.id)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>
    }
</div>
